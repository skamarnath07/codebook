services:
  - type: web
    name: codebook
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codebook-db
          property: connectionString

databases:
  - name: codebook-db
    plan: basic-256mb
    databaseName: codebook
    user: codebook
